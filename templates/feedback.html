{% extends "base.html" %}
{% block content %}
<div style="max-width: 600px; margin: 50px auto; padding: 30px; border: 2px solid #00ffcc; border-radius: 10px; background: rgba(0,0,0,0.8); font-family: monospace;">
    <h2 style="color: #00ffcc; text-align: center;">Give Your Feedback</h2>
    <form action="/feedback" method="POST" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
        <input type="text" name="name" placeholder="Your Name" required style="padding: 10px; background: #111; color: white; border: 1px solid #00ffcc;">
        <input type="email" name="email" placeholder="Your Email" required style="padding: 10px; background: #111; color: white; border: 1px solid #00ffcc;">
        <input type="number" name="rating" min="1" max="5" placeholder="Rating (1 to 5)" required style="padding: 10px; background: #111; color: white; border: 1px solid #00ffcc;">
        <textarea name="message" placeholder="Write your feedback..." rows="4" required style="padding: 10px; background: #111; color: white; border: 1px solid #00ffcc;"></textarea>
        <button type="submit" style="padding: 12px; background: #00ffcc; color: black; font-weight: bold; border: none; cursor: pointer;">Submit Feedback</button>
    </form>
</div>
{% endblock %}
