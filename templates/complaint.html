{% extends "base.html" %}
{% block content %}
<div style="max-width: 600px; margin: 50px auto; padding: 30px; border: 2px solid #00ffcc; border-radius: 10px; background: rgba(0,0,0,0.8); font-family: monospace;">
    <h2 style="color: #00ffcc; text-align: center;">Submit a Cyber Crime Complaint</h2>
    <form action="/complaint" method="POST" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
        <input type="text" name="name" placeholder="Your Full Name" required style="padding: 10px; background: #111; color: white; border: 1px solid #00ffcc;">
        <input type="email" name="email" placeholder="Your Email" required style="padding: 10px; background: #111; color: white; border: 1px solid #00ffcc;">
        <input type="text" name="phone" placeholder="Phone Number" required style="padding: 10px; background: #111; color: white; border: 1px solid #00ffcc;">
        <select name="fraud_type" required style="padding: 10px; background: #111; color: white; border: 1px solid #00ffcc;">
            <option value="Phishing">Phishing Link</option>
            <option value="UPI Fraud">UPI / Money Fraud</option>
            <option value="Other">Other</option>
        </select>
        <textarea name="description" placeholder="Describe your issue..." rows="5" required style="padding: 10px; background: #111; color: white; border: 1px solid #00ffcc;"></textarea>
        <button type="submit" style="padding: 12px; background: #00ffcc; color: black; font-weight: bold; border: none; cursor: pointer;">Submit Complaint</button>
    </form>
</div>
{% endblock %}
