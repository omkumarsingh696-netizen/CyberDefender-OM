<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OSINT Scan</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><div class="auth-container"><div class="auth-card" style="max-width:700px;"><div class="auth-header"><div class="auth-icon">🕵️</div><h1>OSINT EMAIL SCAN</h1></div><form method="POST" class="auth-form"><div class="form-group"><label>Email</label><input type="email" name="email" required></div><button type="submit" class="auth-btn">🕵️ SCAN</button></form>{% if result %}<div class="result-card safe"><h4>Platforms:</h4><ul>{% for p in result.platforms %}<li>{{ p }}</li>{% endfor %}</ul><h4>Dorks:</h4><ul>{% for d in result.dorks %}<li><a href="{{ d }}" target="_blank" style="color:#00d4ff;">{{ d }}</a></li>{% endfor %}</ul></div>{% endif %}<a href="{{ url_for('home') }}" class="back-link">← Back</a></div></div></body></html>
