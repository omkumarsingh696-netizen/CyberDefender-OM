<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Scanner</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><div class="auth-container"><div class="auth-card" style="max-width:700px;"><div class="auth-header"><div class="auth-icon">📸</div><h1>QR CODE SCANNER</h1></div><div id="qrReader" style="width:100%;margin:20px 0;border:2px solid #00ff9d;border-radius:12px;overflow:hidden;"></div><form method="POST"><textarea name="qr_text" rows="3" placeholder="QR content paste karo..." style="width:100%;padding:12px;background:#000814;color:#fff;border:1px solid #00ff9d;border-radius:8px;"></textarea><button type="submit" class="auth-btn" style="margin-top:10px;">🔍 VERIFY</button></form>{% if result %}<div class="result-card {{ 'danger' if result.suspicious else 'safe' }}"><h3>{{ result.status }}</h3><p>{{ result.content }}</p>{% if result.warnings %}<ul class="warnings-list">{% for w in result.warnings %}<li>{{ w }}</li>{% endfor %}</ul>{% endif %}</div>{% endif %}<a href="{{ url_for('home') }}" class="back-link">← Back</a></div></div><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script>try{const q=new Html5QrcodeScanner("qrReader",{fps:10,qrbox:250},false);q.render(t=>{document.querySelector('[name=qr_text]').value=t;q.clear();});}catch(e){document.getElementById('qrReader').innerHTML='<p style="padding:20px;color:#ffa657;">Manual paste use karo</p>';}</script></body></html>
