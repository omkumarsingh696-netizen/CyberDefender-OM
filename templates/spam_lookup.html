<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spam Lookup</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><div class="auth-container"><div class="auth-card" style="max-width:700px;"><div class="auth-header"><div class="auth-icon">📞</div><h1>SPAM NUMBER LOOKUP</h1></div><form method="POST" class="auth-form"><div class="form-group"><label>Phone Number</label><input type="tel" name="phone" required placeholder="+91XXXXXXXXXX"></div><button type="submit" class="auth-btn">🔍 CHECK</button></form>{% if result %}<div class="result-card {{ 'danger' if result.spam_score > 50 else 'safe' }}"><h3>{{ result.status }}</h3><p>Score: {{ result.spam_score }}%</p><p>Country: {{ result.country }}</p></div>{% endif %}<a href="{{ url_for('home') }}" class="back-link">← Back</a></div></div></body></html>
